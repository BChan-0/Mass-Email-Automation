[project]
name = "gmail-draft-builder"
version = "0.1.0"
description = "Generate Gmail drafts from a CSV contact list and a message template"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "Markdown>=3.5",
    "bleach>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests import the app after adjusting sys.path, and repeat long literal setups.
"tests/*" = ["E402"]
